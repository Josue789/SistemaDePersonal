<div class="flex flex-col justify-items-center w-full">
  <mat-card class="w-full">
    <div class="justify-end flex">
      <button mat-icon-button (click)="verTrabajador(empleado)">
        <mat-icon>open_in_new</mat-icon>
      </button>
    </div>

    <mat-card-header class="flex flex-col justify-items-center items-center">
      <div
        mat-card-avatar
        class="relative bg-blue-800 rounded-full flex items-center justify-center w-14 h-14"
      >
        <p class="text-2xl font-bold text-white">
          {{ empleado.nombre.charAt(0) + empleado.apellidoPaterno.charAt(0) }}
        </p>

        <!-- Punto de estado -->
        <span
          class="absolute bottom-0 right-0 w-3 h-3 rounded-full border-2 border-white"
          [ngClass]="{
            'bg-green-500': empleado.estatus === 'Activo',
            'bg-red-500': empleado.estatus === 'Inactivo',
            'bg-gray-400': empleado.estatus === 'Pendiente',
          }"
        >
        </span>
      </div>

      <mat-card-title class="text-center">{{
        empleado.nombre + ' ' + empleado.apellidoPaterno + ' ' + empleado.apellidoMaterno
      }}</mat-card-title>
      <mat-card-subtitle class="text-center font-bold">{{ empleado.puesto }}</mat-card-subtitle>
      <div class="row-span-1 col-span-2 flex justify-between items-center">
        <p class="font-bold">RFC:</p>
        <p>{{ empleado.rfc }}</p>
      </div>
    </mat-card-header>
    <mat-card-content class="grid grid-rows-3 grid-cols-2 gap-2 w-[65%] mx-auto space-y-2 mt-5">
      <div class="row-span-1 col-span-2 flex justify-between items-center">
        <p class="font-bold">Telefono:</p>
        <p>{{ empleado.telefono }}</p>
        <button mat-icon-button (click)="copyToClipboard(empleado.telefono)">
          <mat-icon>content_copy</mat-icon>
        </button>
      </div>
      <div class="row-span-1 col-span-2 flex justify-between items-center">
        <p class="font-bold">Correo:</p>
        <p>{{ empleado.correo }}</p>
        <button mat-icon-button (click)="copyToClipboard(empleado.correo)">
          <mat-icon>content_copy</mat-icon>
        </button>
      </div>
    </mat-card-content>
  </mat-card>
</div>
